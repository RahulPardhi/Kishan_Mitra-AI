<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="soilAnalyzer">Soil Analyzer | Kisan Mitra AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/soil.css">
    <script src="js/config.js"></script>
    <script>if (window.KisanAPI) window.KisanAPI.applyTheme();</script>
</head>

<body>

    <div class="container app-container">

        <!-- Header -->
        <header>
            <a href="dashboard.html">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 data-key="soilAnalyzer">Soil Analyzer</h2>
        </header>

        <!-- Soil Input Form Card -->
        <div class="soil-card screen-enter">

            <label data-key="soilType">Soil Type</label>
            <select id="soilType">
                <option data-key="selectSoilType">Select Soil Type</option>
                <option data-key="blackSoil">Black Soil</option>
                <option data-key="redSoil">Red Soil</option>
                <option data-key="alluvialSoil">Alluvial Soil</option>
                <option data-key="claySoil">Clay Soil</option>
                <option data-key="sandySoil">Sandy Soil</option>
            </select>

            <label data-key="location">Location</label>
            <input type="text" id="location" data-key-placeholder="enterLocation" placeholder="Enter your location">

            <label data-key="nitrogen">Nitrogen (N)</label>
            <input type="number" id="nitrogen" placeholder="Enter Nitrogen ratio">

            <label data-key="phosphorus">Phosphorus (P)</label>
            <input type="number" id="phosphorus" placeholder="Enter Phosphorus ratio">

            <label data-key="potassium">Potassium (K)</label>
            <input type="number" id="potassium" placeholder="Enter Potassium ratio">

            <label data-key="phValue">pH Value</label>
            <input type="number" id="phValue" step="0.1" placeholder="Example: 6.8">

            <button id="analyzeSoil" data-key="analyzeSoil">
                <i class="fa-solid fa-flask"></i>
                Analyze Soil
            </button>

        </div>

        <!-- Soil Analysis Result -->
        <div class="result-card" id="soilResult">
            <h3 data-key="soilReport">🌱 Soil Report</h3>
            <p><strong>Health:</strong> Good</p>
            <p><strong>Recommended Crop:</strong> Wheat</p>
            <p><strong>Suggested Fertilizer:</strong> NPK 20:20:20</p>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span data-key="home">Home</span>
            </a>

            <a href="chatbot.html" class="nav-item">
                <i class="fa-solid fa-robot"></i>
                <span data-key="aiChat">AI Chat</span>
            </a>

            <a href="soil.html" class="nav-item active">
                <i class="fa-solid fa-seedling"></i>
                <span data-key="soil">Soil</span>
            </a>

            <a href="weather.html" class="nav-item">
                <i class="fa-solid fa-cloud-sun"></i>
                <span data-key="weather">Weather</span>
            </a>

            <a href="setting.html" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span data-key="settings">Settings</span>
            </a>
        </nav>

    </div>

    <script src="js/translations.js"></script>
    <script src="js/language.js"></script>
    <script src="js/config.js"></script>
    <script src="js/soil.js"></script>

</body>

</html>
