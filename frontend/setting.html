<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="settings">Settings | Kisan Mitra AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/setting.css">
</head>

<body>

    <div class="container app-container">

        <!-- Header -->
        <header>
            <a href="dashboard.html">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 data-key="settings">Settings</h2>
        </header>

        <!-- Settings List Card -->
        <div class="settings-card screen-enter">

            <!-- Profile Link -->
            <a href="profile.html" class="setting-item">
                <div class="left">
                    <i class="fa-solid fa-user"></i>
                    <span data-key="profile">My Profile</span>
                </div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <!-- Language Selector -->
            <div class="setting-item">
                <div class="left">
                    <i class="fa-solid fa-language"></i>
                    <span data-key="language">Language</span>
                </div>
                <select id="language">
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="mr">Marathi</option>
                </select>
            </div>

            <!-- Notifications Toggle -->
            <div class="setting-item">
                <div class="left">
                    <i class="fa-solid fa-bell"></i>
                    <span data-key="notifications">Notifications</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="notifications">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Dark Mode Toggle -->
            <div class="setting-item">
                <div class="left">
                    <i class="fa-solid fa-moon"></i>
                    <span data-key="darkmode">Dark Mode</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="darkMode">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- About App -->
            <div class="setting-item">
                <div class="left">
                    <i class="fa-solid fa-circle-info"></i>
                    <span data-key="about">About App</span>
                </div>
                <i class="fa-solid fa-chevron-right"></i>
            </div>

            <!-- Logout Button -->
            <button id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span data-key="logout">Logout</span>
            </button>

        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span data-key="home">Home</span>
            </a>

            <a href="chatbot.html" class="nav-item">
                <i class="fa-solid fa-robot"></i>
                <span data-key="aiChat">AI Chat</span>
            </a>

            <a href="soil.html" class="nav-item">
                <i class="fa-solid fa-seedling"></i>
                <span data-key="soil">Soil</span>
            </a>

            <a href="weather.html" class="nav-item">
                <i class="fa-solid fa-cloud-sun"></i>
                <span data-key="weather">Weather</span>
            </a>

            <a href="setting.html" class="nav-item active">
                <i class="fa-solid fa-gear"></i>
                <span data-key="settings">Settings</span>
            </a>
        </nav>

    </div>

    <script src="js/translations.js"></script>
    <script src="js/language.js"></script>
    <script src="js/config.js"></script>
    <script src="js/setting.js"></script>

</body>

</html>
