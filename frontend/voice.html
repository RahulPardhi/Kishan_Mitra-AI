<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="voice">Voice Assistant | Kisan Mitra AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/voice.css">
    <script src="js/config.js"></script>
    <script>if (window.KisanAPI) window.KisanAPI.applyTheme();</script>
</head>

<body>

    <div class="container app-container">

        <!-- Header -->
        <header>
            <a href="dashboard.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 data-key="voice">Voice Assistant</h2>
        </header>

        <!-- Voice Card -->
        <div class="voice-card screen-enter">
            <div class="mic-container" id="micContainer">
                <div class="pulse-ring" id="pulseRing"></div>
                <button class="mic-btn" id="micBtn">
                    <i class="fa-solid fa-microphone" id="micIcon"></i>
                </button>
            </div>
            <p class="status-text" id="statusText" data-key="tapToSpeak">Tap microphone to speak</p>

            <!-- Dedicated Stop Speaking Option -->
            <div>
                <button class="stop-speech-btn" id="stopSpeechBtn" style="display: none;" onclick="stopSpeaking()">
                    <i class="fa-solid fa-circle-stop"></i> <span data-key="stopSpeaking">Stop Speaking</span>
                </button>
            </div>
            
            <!-- Language Selector Badge -->
            <div class="lang-badge" style="margin-top: 14px;">
                <i class="fa-solid fa-earth-americas"></i>
                <select id="voiceLangSelect" class="language-select">
                    <option value="en">English (en-IN)</option>
                    <option value="hi">हिन्दी (hi-IN)</option>
                    <option value="mr">मराठी (mr-IN)</option>
                </select>
            </div>
        </div>

        <!-- Sample Voice Prompts -->
        <div class="prompts-section screen-enter">
            <h4 data-key="voiceDesc">Try asking:</h4>
            <div class="prompt-chips">
                <div class="chip" data-key="voicePrompt1" onclick="triggerVoiceQuery(this.innerText)">Explain NPK values and fertilizer dose</div>
                <div class="chip" data-key="voicePrompt2" onclick="triggerVoiceQuery(this.innerText)">Which crop needs the most water?</div>
                <div class="chip" data-key="voicePrompt3" onclick="triggerVoiceQuery(this.innerText)">How to cure leaf blight disease?</div>
            </div>
        </div>

        <!-- Transcript & Response Log -->
        <div class="transcript-box screen-enter" id="transcriptBox">
            <div class="ai-msg">
                <i class="fa-solid fa-robot"></i>
                <span>👋 <strong data-key="appName">Kisan Mitra AI</strong> Voice Assistant. <br>Tap the mic and ask me anything about your crops, weather, or soil!</span>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span data-key="home">Home</span>
            </a>
            <a href="chatbot.html" class="nav-item">
                <i class="fa-solid fa-robot"></i>
                <span data-key="aiChat">AI Chat</span>
            </a>
            <a href="soil.html" class="nav-item">
                <i class="fa-solid fa-seedling"></i>
                <span data-key="soil">Soil</span>
            </a>
            <a href="weather.html" class="nav-item">
                <i class="fa-solid fa-cloud-sun"></i>
                <span data-key="weather">Weather</span>
            </a>
            <a href="setting.html" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span data-key="settings">Settings</span>
            </a>
        </nav>

    </div>

    <script src="js/translations.js"></script>
    <script src="js/language.js"></script>
    <script src="js/config.js"></script>
    <script src="js/voice.js"></script>
</body>

</html>
